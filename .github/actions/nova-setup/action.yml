name: TCM NOVA setup
description: Python, ecCodes, the NOVA requirements, and the compiled-kernel (Numba) cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    # the whole installed environment is cached (restores in seconds; pip only runs when
    # requirements.txt changes) -- job start-up is on the Main Run's critical path
    - uses: actions/cache@v4
      id: pyenv
      with:
        path: ${{ env.pythonLocation }}
        key: nova-pyenv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('tools/tcm-nova/requirements.txt') }}
    - shell: bash
      run: sudo apt-get install -y -qq --no-install-recommends libeccodes0 libeccodes-data >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libeccodes0 libeccodes-data >/dev/null)
    - if: steps.pyenv.outputs.cache-hit != 'true'
      shell: bash
      run: pip install -q -r tools/tcm-nova/requirements.txt
    # Numba keys its on-disk cache on each source file's modification time, which a fresh
    # checkout resets. Pinning the times keeps the compiled kernels valid between runs, so
    # a job loads them in seconds instead of compiling for a minute. The cache key is the
    # hash of the kernel sources and is only ever restored on an EXACT match, so a changed
    # kernel can never be served from an old compilation.
    - shell: bash
      run: find tools/tcm-nova/nova tools/tcm-v5/app -name '*.py' -exec touch -d '2026-01-01T00:00:00Z' {} +
    - uses: actions/cache@v4
      with:
        path: /tmp/numba
        key: nova-kernels-${{ runner.os }}-${{ hashFiles('tools/tcm-nova/nova/v5x/*.py', 'tools/tcm-nova/nova/hyper/engine2.py', 'tools/tcm-nova/requirements.txt') }}
    - uses: actions/cache@v4
      with:
        path: /tmp/nova/cache/v5_pseudoadiabat_rk4_v1.npy
        key: nova-pseudoadiabat-v1
