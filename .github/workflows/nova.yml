# TCM NOVA on GitHub's servers, so the forecasts keep running when the PC is off.
#
# Every ~10 minutes the `route` job asks the PUBLISHED STATE what is missing and starts it
# (tools/tcm-nova/route_ci.py). GitHub drops or delays many scheduled triggers -- on
# 19 Oct 2026 only 13 of ~30 fired, which is why the 09Z/15Z Main Runs and most
# Hyper-Short hours never appeared -- so nothing here is keyed to which trigger fired: a
# dropped trigger is simply caught by the next one.
#
#   main       03/09/15/21 UK time   TCM Main Run on the TCM V5 engine, 3-hourly to 4 days.
#                                    17 jobs side by side, two lead times each; one job
#                                    assembles and publishes.
#   ukv-env    each new UKV cycle    Hyper-Short's UKV half (TCM V5 on UKV), computed as soon
#                                    as the cycle reaches AWS, 6 jobs side by side.
#   hyper      every hour            TCM Hyper-Short (radar + lightning nowcast + UKV/V5),
#                                    then the UK & Ireland lightning archive.
#   learning   00:20 UK time         verify yesterday, retrain weights + calibration + NOVA-AI
#   train      on demand             historical training, one parallel job per day
#
# Results are GitHub Release assets (nova-main, nova-hyper, nova-ukvenv, nova-state,
# nova-lightning); the self-hosted site mirrors them. All inputs are public open data.
name: TCM NOVA

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    paths: ['tools/tcm-nova/TRAIN_REQUEST.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'auto | main | hyper | ukv_env | learning | train'
        required: true
        default: auto
      train_start: { description: 'train: first day (YYYY-MM-DD)', required: false, default: '2026-06-01' }
      train_end:   { description: 'train: last day', required: false, default: '2026-10-12' }
      train_every: { description: 'train: every N days', required: false, default: '4' }

permissions:
  contents: write
  actions: write

env:
  NOVA_DATA: /tmp/nova/data
  NOVA_CACHE: /tmp/nova/cache
  PYTHONPATH: tools/tcm-nova
  GH_TOKEN: ${{ github.token }}
  NUMBA_CACHE_DIR: /tmp/numba

jobs:
  # GitHub's scheduler fires this repository's cron irregularly (often only hourly). Every
  # run therefore also starts the NEXT run itself, ~9 minutes later, through
  # workflow_dispatch -- the one event GitHub's own token is allowed to trigger. The
  # concurrency group keeps exactly one such chain alive (a newer heartbeat replaces an
  # older one), and the cron above restarts the chain if it ever breaks.
  heartbeat:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: nova-heartbeat, cancel-in-progress: true }
    steps:
      - run: |
          sleep 540
          gh workflow run nova.yml -R "${{ github.repository }}" -f job=auto

  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main: ${{ steps.r.outputs.main }}
      main_init: ${{ steps.r.outputs.main_init }}
      main_chunks: ${{ steps.r.outputs.main_chunks }}
      hyper: ${{ steps.r.outputs.hyper }}
      ukv_env: ${{ steps.r.outputs.ukv_env }}
      ukv_env_cycle: ${{ steps.r.outputs.ukv_env_cycle }}
      ukv_env_chunks: ${{ steps.r.outputs.ukv_env_chunks }}
      learning: ${{ steps.r.outputs.learning }}
      train: ${{ steps.t.outputs.train }}
      days: ${{ steps.t.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/tcm-nova/route_ci.py, sparse-checkout-cone-mode: false }
      - id: r
        run: |
          J="${{ inputs.job }}"; [ -z "$J" ] && J=auto
          [ "${{ github.event_name }}" = "push" ] && J=none
          [ "$J" = "train" ] && J=none
          python3 tools/tcm-nova/route_ci.py "$J"
      - id: t
        run: |
          TS="${{ inputs.train_start }}"; TE="${{ inputs.train_end }}"; TN="${{ inputs.train_every }}"; T=false
          [ "${{ inputs.job }}" = "train" ] && T=true
          if [ "${{ github.event_name }}" = "push" ]; then
            T=true
            curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tools/tcm-nova/TRAIN_REQUEST.json" -o /tmp/req.json
            TS=$(python3 -c "import json;print(json.load(open('/tmp/req.json'))['start'])")
            TE=$(python3 -c "import json;print(json.load(open('/tmp/req.json'))['end'])")
            TN=$(python3 -c "import json;print(json.load(open('/tmp/req.json'))['every'])")
          fi
          echo "train=$T" >> "$GITHUB_OUTPUT"
          if [ "$T" = "true" ]; then
            python3 -c "
          import json,datetime as d
          a=d.date.fromisoformat('$TS'); b=d.date.fromisoformat('$TE'); n=int('$TN')
          print('days='+json.dumps([(a+d.timedelta(days=i)).isoformat() for i in range(0,(b-a).days+1,n)]))" >> "$GITHUB_OUTPUT"
          else echo 'days=[]' >> "$GITHUB_OUTPUT"; fi

  # ── Main Run (TCM V5 on every model at 2 km) ────────────────────────────────
  main-chunk:
    needs: route
    if: needs.route.outputs.main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        leads: ${{ fromJSON(needs.route.outputs.main_chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static
      - run: python -m nova.cloud fetch-state
      - name: TCM V5 frames T+${{ matrix.leads }}
        run: python -m nova.v5_run --product main --init "${{ needs.route.outputs.main_init }}" --leads "${{ matrix.leads }}" --chunk
      - uses: actions/upload-artifact@v4
        with:
          name: main-chunk-${{ strategy.job-index }}
          path: /tmp/nova/data/main/
          retention-days: 2

  main-publish:
    needs: [route, main-chunk]
    if: always() && needs.route.outputs.main == 'true' && needs.main-chunk.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: nova-main-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - uses: actions/download-artifact@v4
        with: { pattern: main-chunk-*, merge-multiple: true, path: /tmp/nova/data/main/ }
      - run: python -m nova.v5_run --product main --init "${{ needs.route.outputs.main_init }}" --assemble && python -m nova.cloud publish main

  # ── Hyper-Short's UKV environment (TCM V5 on UKV), per new UKV cycle ────────
  ukv-env:
    needs: route
    if: needs.route.outputs.ukv_env == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hours: ${{ fromJSON(needs.route.outputs.ukv_env_chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static
      - name: TCM V5 on UKV ${{ needs.route.outputs.ukv_env_cycle }} T+${{ matrix.hours }}
        run: python -m nova.hyper.v5env --cycle "${{ needs.route.outputs.ukv_env_cycle }}" --hours "${{ matrix.hours }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ukv-env-${{ strategy.job-index }}
          path: /tmp/nova/cache/ukvenv/
          retention-days: 1

  ukv-env-publish:
    needs: [route, ukv-env]
    if: always() && needs.route.outputs.ukv_env == 'true' && needs.ukv-env.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: nova-ukvenv-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/tcm-nova, sparse-checkout-cone-mode: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { pattern: ukv-env-*, merge-multiple: true, path: /tmp/nova/cache/ukvenv/ }
      - run: pip install -q numpy && python -m nova.cloud publish-ukvenv "${{ needs.route.outputs.ukv_env_cycle }}"

  # ── Hyper-Short, hourly ─────────────────────────────────────────────────────
  hyper:
    needs: route
    if: needs.route.outputs.hyper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: nova-hyper, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static
      - run: python -m nova.cloud fetch-state
      - run: python -m nova.cloud fetch-ukvenv
      - name: Hyper-Short
        run: python -m nova.hyper.run && python -m nova.cloud publish hyper
      - name: Lightning archive
        if: always()
        run: python -m nova.cloud lightning

  # ── nightly learning ────────────────────────────────────────────────────────
  learning:
    needs: route
    if: needs.route.outputs.learning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency: { group: nova-learning, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static && python -m nova.cloud fetch-state && python -m nova.cloud lightning
      - name: Yesterday's runs
        run: |
          DAY=$(TZ=Europe/London date -d yesterday +%F)
          python -m nova.cloud fetch-runs main --day "$DAY"
          python -m nova.cloud fetch-runs hyper --day "$DAY"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - run: python -m nova.learn --day "$DAY"
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }
      - run: python -m nova.cloud publish-state

  # ── historical training (on demand) ─────────────────────────────────────────
  train-prep:
    needs: route
    if: needs.route.outputs.train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static

  train-day:
    needs: [route, train-prep]
    if: needs.route.outputs.train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: { day: '${{ fromJson(needs.route.outputs.days) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static
      - name: Hindcast ${{ matrix.day }}
        run: python -c "from datetime import date; from nova.calibrate import hindcast; hindcast([date.fromisoformat('${{ matrix.day }}')])"
      - name: Turn the hindcast into training pairs (radar + lightning verification)
        run: python -c "from nova.calibrate import collect; collect()"
      - uses: actions/upload-artifact@v4
        with:
          name: train-${{ matrix.day }}
          path: |
            ${{ env.NOVA_DATA }}/learning/pairs
            ${{ env.NOVA_DATA }}/hindcast/*/sources
            ${{ env.NOVA_DATA }}/hindcast/*/manifest.json
          retention-days: 7

  train-fit:
    needs: [route, train-day]
    if: always() && needs.route.outputs.train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nova-setup
      - run: python -m nova.cloud fetch-static && python -m nova.cloud fetch-state
      - uses: actions/download-artifact@v4
        with: { pattern: 'train-*', path: /tmp/nova/train, merge-multiple: true }
      - name: Merge day results
        run: |
          mkdir -p $NOVA_DATA/learning/pairs $NOVA_DATA/hindcast
          cp -rn /tmp/nova/train/learning/pairs/. $NOVA_DATA/learning/pairs/ 2>/dev/null || cp -rn /tmp/nova/train/pairs/. $NOVA_DATA/learning/pairs/ || true
          cp -rn /tmp/nova/train/hindcast/. $NOVA_DATA/hindcast/ 2>/dev/null || true
          ls $NOVA_DATA/learning/pairs | wc -l
      - name: Train weights, calibration and NOVA-AI
        run: python -c "from nova.calibrate import train_skill, fit; train_skill(('hindcast',)); fit()"
      - run: python -m nova.cloud publish-state
