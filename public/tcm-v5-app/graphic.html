  /* ---- Text ---- */
  h += '<h2>Wording</h2><div class="grid2">' +
    '<label>Strapline</label><input type="text" data-act="footerText" value="' + esc(S.footerText) + '">' +
    '<label>Handle</label><input type="text" data-act="handle" value="' + esc(S.handle) + '">' +
    '<label>Version</label><input type="text" data-act="version" value="' + esc(S.version) + '">' +
    '<label>Valid until</label><input type="datetime-local" data-act="validUntil" value="' + esc(S.validUntil) + '">' +
    '</div>' +
    '<input type="text" data-act="disclaimer" value="' + esc(S.disclaimer) + '" style="margin-top:6px">' +
    '<p class="hint">The disclaimer line. Clearing it publishes a graphic that can be mistaken for an official warning.</p>';
  if (!radar) {
    h += '<div class="row" style="margin-top:8px"><button data-act="toggleDiscussion"' +
      (S.discussionEnabled ? ' class="on"' : '') + '>Forecast discussion</button></div>';
    if (S.discussionEnabled)
      h += '<textarea data-act="discussionText" placeholder="Forecaster narrative...">' + esc(S.discussionText) + '</textarea>';
  }

  /* ---- Export ---- */
  h += '<h2>Export</h2><div class="row">' +
    seg('exportScale', [{ v:'1', l:'1x' }, { v:'2', l:'2x' }, { v:'4', l:'4x' }], String(S.exportScale)) +
    '<button data-act="export" class="primary">Save PNG</button></div>' +
    '<div class="status" id="exportStatus"></div>' +
    (siteLogoIsPlaceholder ? '<div class="warnbox">The footer mark is a placeholder. Drop the real logo in as <b>frontend/assets/myweatheruk-logo.png</b> and it is used automatically.</div>' : '') +
    '<div class="meta" style="margin-top:10px">Map ' + (S.coastSource === 'tcm-landmask'
      ? '<b>TCM land mask</b> - the detailed coastline could not be reached, so this is the model outline and is coarser'
      : S.coastSource ? '<b>high-detail coastline</b>' : 'loading') + '.</div>';

  box.innerHTML = h;
  // The surface only captures pointers when there is something to place: the
  // draw tool needs drawing switched on, the others are always live.
  surface.className = (S.mapTool !== 'draw' || S.drawMode) ? S.mapTool : 'off';
}

/* ---- Control wiring ---------------------------------------------------- */
box.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  const act = t.dataset.act, val = t.dataset.val;
  let rebuild = true;
  switch (act) {
    case 'mode':        S.graphicMode = val;
                        S.activeRisk = val === 'radar' ? RADAR_LEVELS[0].id : 'Slight';
                        S.hazards = val === 'radar' ? ['thunder'] : ['lightning','hail','flood']; break;
    case 'forecastType': S.forecastType = val; break;
    case 'toggleOvernight': S.overnightEnabled = !S.overnightEnabled; break;
    case 'mapTool':     S.mapTool = val; break;
    case 'annColor':    S.annColor = val; break;
    case 'annSize':     S.annSize = val; break;
    case 'toggleAnnPill':   S.annPill = !S.annPill; break;
    case 'toggleAnnLeader': S.annLeader = !S.annLeader; break;
    case 'delAnn':      S.annotations.splice(+val, 1); break;
    case 'arrowColor':  S.arrowColor = val; break;
    case 'clearArrows': S.arrows = []; break;
    case 'confidence':  S.confidence = val || null; break;
    case 'gran':        setGranularity(val); break;
    case 'toggleRange': S.timelineRangeMode = !S.timelineRangeMode; S.rangeAnchor = null; break;
    case 'clearTimeline': S.stampRisks = stamps.map(() => null);
                          S.stampOverlays = stamps.map(() => null); S.rangeAnchor = null; break;
    case 'fillTimeline': fillTimelineFromModel(); rebuild = false; break;
    case 'risk':        S.activeRisk = val; break;
    case 'hazard':      S.hazards = S.hazards.includes(val)
                          ? S.hazards.filter(x => x !== val) : S.hazards.concat([val]); break;
    case 'toggleDraw':  S.drawMode = !S.drawMode; break;
    case 'toggleShapes': S.showShapes = !S.showShapes; break;
    case 'toggleCities': S.showCities = !S.showCities; break;
    case 'toggleCounties': S.showCounties = !S.showCounties; break;
    case 'undo':        S.shapes.pop(); break;
    case 'clearShapes': S.shapes = []; break;
    case 'delShape':    S.shapes.splice(+val, 1); break;
    case 'promote':     promoteShape(+val); break;
    case 'importReplace': importOutlook(true); rebuild = false; break;
    case 'importAdd':     importOutlook(false); rebuild = false; break;
    case 'toggleLightning': S.showLightning = !S.showLightning;
                            if (S.showLightning && !S.strikes) { loadStrikes(1440); } break;
    case 'strikes':     loadStrikes(+val); S.showLightning = true; break;
    case 'toggleLive':  setLivePolling(!S.liveStrikes); if (S.liveStrikes) loadStrikes(null, true); break;
    case 'lightningColor': if (val) S.lightningColor = val; break;
    case 'toggleStrikeOutline': S.lightningOutline = !S.lightningOutline; break;
    case 'toggleDiscussion': S.discussionEnabled = !S.discussionEnabled; break;
    case 'exportScale': S.exportScale = +val; break;
    case 'export':      exportPNG(); rebuild = false; break;
    default: rebuild = false;
  }
  if (rebuild) buildControls();
  render();
});

box.addEventListener('input', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, v = t.value;
  switch (act) {
    case 'validDate':  S.validDate = v; break;
    case 'validDate2': S.validDate2 = v; break;
    case 'updateNumber': S.updateNumber = Math.max(1, +v || 1); break;
    case 'overnightStart': S.overnightStart = v; break;
    case 'overnightEnd':   S.overnightEnd = v; break;
    case 'annDraft':   S.annDraft = v; break;
    case 'region':     S.outlookRegion = v; break;
    case 'drawOpacity': S.drawOpacity = +v; break;
    case 'lightningColor': S.lightningColor = v; break;
    case 'lightningOutlineColor': S.lightningOutlineColor = v; break;
    case 'footerText': S.footerText = v; break;
    case 'handle':     S.handle = v; break;
    case 'version':    S.version = v; break;
    case 'validUntil': S.validUntil = v; break;
    case 'discussionText': S.discussionText = v; break;
    case 'disclaimer': S.disclaimer = v; break;
    default: return;
  }
  render();
});

/* Promote an area one rung up the ladder, wrapping at the top. */
function promoteShape(i) {
  const ids = activeLevels().map(l => l.id);
  const at = ids.indexOf(S.shapes[i].riskLevel);
  S.shapes[i].riskLevel = ids[(at + 1) % ids.length];
}

/* Changing granularity resizes the stamp arrays. Existing stamps are carried
   across by their LABEL, not their index, so a band set at 15Z stays at 15Z
   instead of sliding to whatever now sits in that slot. */
function setGranularity(g) {
  const oldLabels = TIMELINE_PRESETS[S.timelineGran];
  const oldRisks = S.stampRisks, oldOver = S.stampOverlays;
  const byLabel = {}, byLabelOver = {};
  oldLabels.forEach((l, i) => {
    if (oldRisks[i]) byLabel[l] = oldRisks[i];
    if (oldOver[i])  byLabelOver[l] = oldOver[i];
  });
  S.timelineGran = g;
  stamps = buildStamps(g);
  S.stampRisks    = TIMELINE_PRESETS[g].map(l => byLabel[l] || null);
  S.stampOverlays = TIMELINE_PRESETS[g].map(l => byLabelOver[l] || null);
  S.rangeAnchor = null;
}

/* ==========================================================================
   BOOT
   ========================================================================== */
let rafPending = false;
function render() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; draw(); });
}

window.addEventListener('resize', () => { sizeCanvas(); render(); });

(async function boot() {
  sizeCanvas();
  buildControls();
  render();
  // The map is the slow part; draw everything else first rather than making the
  // page wait on it, then repaint when it lands.
  const c = await loadCoastline();
  S.coast = c.rings; S.coastSource = c.source;
  buildControls();
  render();
  loadStrikes(1440).catch(() => {});
  setLivePolling(S.liveStrikes);
  // County lines are ~7 MB of source across three files, so they land last and
  // repaint when ready rather than holding up the coastline behind them.
  loadCounties().then(function (rings) {
    if (rings) { S.counties = rings; render(); }
  }).catch(() => {});
})();
</script>
</body>
