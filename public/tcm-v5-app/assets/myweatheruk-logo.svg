<!--
  PLACEHOLDER, not the real brand asset.

  The supplied MyWeatherUK mark could not be installed: it arrived as a chat
  attachment, which cannot be written to disk, and the copies on this machine
  are a different variant (a beach photograph behind the circle) rather than
  the clean mark. Drop the real file in as

      frontend/assets/myweatheruk-logo.png

  and the header picks it up automatically. The img tag tries the PNG first
  and only falls back to this file when it is missing.
-->
