<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="UK weather warnings, live radar, lightning tracking and storm outlooks." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MyWeatherUK</title>
    <script>
      // Stamp the theme before first paint so the page never flashes the wrong
      // one. Must match ThemeProvider in src/components/ThemeContext.jsx: the
      // key is 'theme', the value is the string "true"/"false", and an absent
      // value means dark.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === null || saved === 'true') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
