<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="UK weather warnings, live radar, lightning tracking and storm outlooks." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MyWeatherUK</title>
    <script>
      // Stamp the theme (and the language) before first paint so the page never
      // flashes the wrong one. Reads the preferences src/lib/preferences.jsx saves
      // under 'mwuk_prefs' (or the old 'theme' key before that has run once);
      // nothing saved means dark.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('mwuk_prefs') || 'null');
          var t = p && p.theme;
          if (!t) { var old = localStorage.getItem('theme'); t = old === 'false' || old === 'light' ? 'light' : 'dark'; }
          var dark = t === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : t !== 'light';
          if (dark) document.documentElement.classList.add('dark');
          if (p && p.language) document.documentElement.lang = p.language;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
